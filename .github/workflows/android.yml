name: Android

# Builds the Android app and runs its unit tests. Only when the app changes: the
# Mac has no Android tooling, so this is where the app is compiled at all.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository's own wrapper, so CI builds with the Gradle a Mac uses;
      # setup-gradle also checks the wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app and run the unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # THE ROUTES AND THE SIGNED-IN ROUND TRIP on an emulator (FlowWalk.kt,
  # SignedInRoundTrip.kt), the Android twin of ios.yml's signed-in tests:
  # a save on the real test account (scripts/test_session.py, ours, never a
  # reader) reaches the server, survives a restart, and comes off again.
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: A real session for the test account
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          S=$(python3 scripts/test_session.py 2>/dev/null || true)
          if [ -n "$S" ]; then
            for part in $(echo "$S" | tr '|' ' '); do echo "::add-mask::$part"; done
            echo "::add-mask::$S"
            echo "AT_SESSION=$S" >> "$GITHUB_ENV"
            echo "test account signed in"
          else
            echo "::warning::no test session: the signed-in round trip will skip"
          fi

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.AT_SESSION=$AT_SESSION"

      - name: Keep the walk's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-walk-report
          path: android/app/build/reports/androidTests/connected
          retention-days: 7
