name: Android

# Builds the Android app and runs its unit tests. Only when the app changes: the
# Mac has no Android tooling, so this is where the app is compiled at all.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository's own wrapper, so CI builds with the Gradle a Mac uses;
      # setup-gradle also checks the wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app and run the unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
