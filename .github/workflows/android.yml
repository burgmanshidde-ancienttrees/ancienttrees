name: Android

# Builds the Android app and runs its unit tests. Only when the app changes: the
# Mac has no Android tooling, so this is where the app is compiled at all.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'scripts/android_spacing.py'
      - 'data/ios-frames.json'
      - 'data/android-spacing-pending.json'
      - 'data/android-parity.json'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'scripts/android_spacing.py'
      - 'data/ios-frames.json'
      - 'data/android-spacing-pending.json'
      - 'data/android-parity.json'
  workflow_dispatch:
  # ButtonWalk.kt, once a day (the iPhone's buttonwalk.yml runs at 05:40 UTC).
  schedule:
    - cron: '10 6 * * *'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository's own wrapper, so CI builds with the Gradle a Mac uses;
      # setup-gradle also checks the wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app and run the unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # THE RELEASE BUILD AS GOOGLE PLAY TAKES IT: bundleRelease with R8 on,
  # unsigned here (the upload key lives only on the Mac, scripts/
  # android_release.py signs it there), so a change that breaks the release
  # build, a shrinker rule or a resource R8 strips, is caught on the pull request
  # and not on upload day. The merged manifest is held to the Data safety form:
  # no advertising id permission (drafts/play-console-forms.md).
  release:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release bundle (unsigned)
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: No advertising id in the release manifest
        run: |
          m=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -1)
          test -n "$m"
          if grep -q 'com.google.android.gms.permission.AD_ID' "$m"; then echo "::error::AD_ID permission in $m"; exit 1; fi

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

  # THE ROUTES AND THE SIGNED-IN ROUND TRIP on an emulator (FlowWalk.kt,
  # SignedInRoundTrip.kt), the Android twin of ios.yml's signed-in tests:
  # the iPhone's FlowWalk flows with its identifiers, a way back after every
  # step, and a save on the real test account (scripts/test_session.py, ours,
  # never a reader) that reaches the server, survives a restart, and comes off
  # again. ButtonWalk is left to its own job below: it launches the app once per
  # button and would hold every pull request for an hour.
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    # ONE ROUND TRIP ON THE TEST ACCOUNT AT A TIME, across every branch: parallel
    # runs flipped each other's saves on apptest@ (2026-11-11, PR 55's
    # SignedInRoundTrip waited for "not selected" while three walks shared it).
    concurrency:
      group: android-test-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: A real session for the test account
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          S=$(python3 scripts/test_session.py 2>/dev/null || true)
          if [ -n "$S" ]; then
            for part in $(echo "$S" | tr '|' ' '); do echo "::add-mask::$part"; done
            echo "::add-mask::$S"
            echo "AT_SESSION=$S" >> "$GITHUB_ENV"
            echo "test account signed in"
          else
            echo "::warning::no test session: the signed-in round trip will skip"
          fi

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disable-animations: true
          working-directory: android
          # The frames every step left (FlowWalk.shoot) come out whether it passed or not.
          # A HANG FAILS FAST (2026-11-12: one sat 35 minutes after test 1 and the
          # job's 40 cancelled it with nothing to read): gradle gets 25 minutes,
          # each test 4 (FlowWalk's Timeout rule), and the runner's, crash and app lines
          # of the phone's log (never the whole log: the artifact is public) go into the
          # report, the last test that started printed here.
          script: timeout 1500 ./gradlew --no-daemon connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.AT_SESSION=$AT_SESSION" -Pandroid.testInstrumentationRunnerArguments.notClass=app.ancienttrees.ButtonWalk; s=$?; mkdir -p ../out/android-walk; adb pull /data/local/tmp/walk/. ../out/android-walk || true; adb logcat -d -s TestRunner:* AndroidRuntime:* AncientTrees:* > ../out/android-walk/logcat.txt || true; if [ $s -ne 0 ]; then echo "walk ended $s; the tests that started:"; grep "TestRunner: started" ../out/android-walk/logcat.txt | tail -3; fi; exit $s

      - name: Keep the walk's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-walk-report
          path: |
            android/app/build/reports/androidTests/connected
            out/android-walk
          retention-days: 7

  # THE IPHONE'S VERTICAL SPACING (scripts/android_spacing.py; Hidde,
  # 2026-11-10: "the vertical spacing feels different on certain pages - make
  # sure that design really are alike"). Every ported screen opened with the
  # iPhone's own launch arguments on a 1080 by 2400 phone set to 402 dp wide,
  # its UI Automator tree held against the iPhone 17 Pro's frames in
  # data/ios-frames.json: a gap or height more than 4 off fails, unless
  # data/android-parity.json gives that gap a reason.
  spacing:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: apk

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure every ported screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: python3 scripts/android_spacing.py --ci --apk apk/app-debug.apk

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-spacing
          path: out/parity
          retention-days: 7

  # EVERY BUTTON ANSWERS A FINGER (ButtonWalk.kt, the twin of the iPhone's
  # ButtonWalk.swift and buttonwalk.yml): every control on the iPhone's 14
  # screens, signed out and in, tapped on a fresh launch; one that changes
  # nothing fails. Daily and on dispatch, as on the iPhone, because it is slow.
  buttonwalk:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tap every button
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.ancienttrees.ButtonWalk

      - name: Keep the walk's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-buttonwalk-report
          path: android/app/build/reports/androidTests/connected
          retention-days: 7
