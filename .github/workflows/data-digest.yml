name: Data digest

on:
  schedule:
    # Once, early: 05:15 UTC so the previous UTC day is complete and the entry
    # exists before Hidde's morning. The nightly research runs read DATA.md
    # for their own conclusions; this workflow only produces the numbers.
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite today's entry even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write
  # write, not read: the watchdog step below dispatches nightly.yml when the
  # night shift has gone silent. workflow_dispatch is the documented exception
  # to GITHUB_TOKEN's no-recursive-runs rule, so this cannot loop.
  actions: write

concurrency:
  group: data-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the digest entry
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/daily_digest.py ${{ inputs.force && '--force' || '' }}

      # The digest's promote() rescores data/city-queue.json from Search
      # Console; regenerating here keeps the rendered table and the inventory
      # in agreement, which qa.py enforces on the next deploy. Without this
      # step the requeue happened on the runner and evaporated: the first
      # promote run (2026-08-13 morning) did exactly that, because the commit
      # below only added DATA.md.
      # rescore.py FIRST, then city_queue.py. promote() above writes the
      # measured columns only; rescore.py turns them into score and basis on
      # travel demand and realised yield; city_queue.py assigns rank and
      # renders the table. Added 2026-08-16 to end a two-day split brain where
      # promote() and rescore.py both wrote `score` with different formulas and
      # the queue came out half one and half the other.
      - name: Re-rank the queue from the new numbers
        run: |
          python3 scripts/rescore.py --write
          python3 scripts/city_queue.py

      # The staging shelf stocks itself here, not only inside Claude runs.
      # Hidde, 2026-08-13: "er gaan weken zijn dat ik er helemaal niet ben."
      # A Claude run dies the moment the usage window closes, which is exactly
      # when nobody is around to notice an empty shelf; this workflow costs
      # zero tokens and fires daily regardless. prepare.py is deterministic
      # (register rows within 5 km, dedup annotations, live tree counts), so
      # there is nothing for a model to decide.
      - name: Stock the staging shelf
        run: python3 scripts/prepare.py

      # Measure any photograph added since yesterday, so the size data the
      # homepage pickers and qa.py depend on never goes stale (2026-08-21).
      - name: Measure new photographs
        run: python3 scripts/photo_res.py || true

      # The mutual watchdog. The night runs already redispatch THIS workflow
      # when it goes stale (CLAUDE.md rung 2); until now nothing did the
      # reverse, so a stretch of dropped nightly schedules would only ever be
      # a line in DATA.md that nobody reads while Hidde is away. GitHub drops
      # cron schedules routinely (measured: 5-7 of 9 knocks fire on a normal
      # day), and 26 hours of total silence is past bad luck. This workflow is
      # the right watchdog because it is the leg that runs without tokens.
      - name: Wake the night shift if it has gone silent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh run list --workflow=nightly.yml -R "${{ github.repository }}"             --limit 1 --json createdAt --jq '.[0].createdAt' 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then echo "no nightly history readable; skipping"; exit 0; fi
          AGE=$(( $(date -u +%s) - $(date -u -d "$LAST" +%s) ))
          if [ "$AGE" -gt 93600 ]; then
            echo "nightly silent for $(( AGE / 3600 ))h; dispatching"
            gh workflow run nightly.yml -R "${{ github.repository }}"               && echo "dispatched" || echo "dispatch failed; cron remains the fallback"
          else
            echo "nightly last fired $(( AGE / 3600 ))h ago; healthy"
          fi

      # The contributor reply loop's transport (spec 2026-08-21): thank-yous
      # and run-composed answers to readers who left an email. Absent SMTP
      # secrets = the script prints a dry run and sends nothing, never broken.
      - name: Thank and answer contributors
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OUTREACH_SMTP_HOST: ${{ secrets.OUTREACH_SMTP_HOST }}
          OUTREACH_SMTP_PORT: ${{ secrets.OUTREACH_SMTP_PORT }}
          OUTREACH_SMTP_USER: ${{ secrets.OUTREACH_SMTP_USER }}
          OUTREACH_SMTP_PASS: ${{ secrets.OUTREACH_SMTP_PASS }}
          OUTREACH_FROM: ${{ secrets.OUTREACH_FROM }}
        run: python3 scripts/contributor_reply.py --send

      - name: Commit if there is a new entry
        run: |
          git config user.name "burgmanshidde-ancienttrees"
          git config user.email "304936064+burgmanshidde-ancienttrees@users.noreply.github.com"
          # LEDGER.html joined this list on 2026-08-18 because leaving it out
          # killed the whole run. city_queue.py rewrites it, it was not staged,
          # and so `git pull --rebase` refused with "cannot pull with rebase:
          # You have unstaged changes". The commit had already succeeded, so the
          # digest wrote its entry and then threw it away: DATA.md simply had no
          # row for 2026-08-17 and nothing anywhere said why.
          git add DATA.md data/city-queue.json data/city-list.json CITY_QUEUE.md LEDGER.html \
            data/outreach-sent.json data/cities \
            data/city-coords.json data/research/*-register-candidates.json 2>/dev/null || \
            git add DATA.md data/city-queue.json data/city-list.json CITY_QUEUE.md LEDGER.html data/city-coords.json data/outreach-sent.json
          if git diff --cached --quiet; then
            echo "No new entry today."
          else
            git commit -m "Daily data digest, and the queue re-ranked from it"
            # autoStash so the NEXT script that writes a file nobody listed here
            # cannot kill the run the same way. Naming files is the fix; this is
            # the belt, because the list will go stale again.
            git -c rebase.autoStash=true pull --rebase
            git push
          fi
