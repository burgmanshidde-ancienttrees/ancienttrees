name: Data digest

on:
  schedule:
    # Once, early: 05:15 UTC so the previous UTC day is complete and the entry
    # exists before Hidde's morning. The nightly research runs read DATA.md
    # for their own conclusions; this workflow only produces the numbers.
    - cron: "15 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: data-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the digest entry
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/daily_digest.py

      - name: Commit if there is a new entry
        run: |
          git config user.name "burgmanshidde-ancienttrees"
          git config user.email "304936064+burgmanshidde-ancienttrees@users.noreply.github.com"
          git add DATA.md
          if git diff --cached --quiet; then
            echo "No new entry today."
          else
            git commit -m "Daily data digest"
            git pull --rebase
            git push
          fi
