name: Build and deploy site

on:
  push:
    branches: [main]
  # A CLOCK, BECAUSE A PUSH IS NOT ENOUGH (2026-09-23). A push made with
  # GITHUB_TOKEN never triggers another workflow, which is documented GitHub
  # behaviour and not a fault here, and the night runs push with exactly that.
  # So this workflow fires only when a person pushes from a laptop. Between
  # 19 and 23 September nobody did, and the site served the 19th for four days
  # while trees, translations and a blueprint change sat in main. Every three
  # hours costs one eight-minute build and makes the machine's own work reach
  # readers without waiting for somebody to open a terminal.
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# A PUSH MAY CANCEL A PUSH; A DISPATCHED BUILD FINISHES. Same fault and same
# fix as ios.yml on 2026-08-25, appearing here on 2026-09-02: eleven builds in
# a row were cancelled between 17:31 and 17:48, one every one to three minutes,
# because a night run doing verify passes commits its claims and releases
# faster than a build takes. A build takes eight minutes, so not one of them
# could ever finish and the site quietly stopped deploying. Nothing failed;
# there was simply never a verdict.
#
# Cancelling a superseded PUSH is still right: judging a commit that has
# already been replaced costs a runner ten minutes and tells nobody anything.
# What was wrong is that there was no way to ask for a build that survives the
# next commit. A dispatched run gets a group of its own and is never cancelled,
# so a person (or an agent that has just pushed something it needs to verify)
# can always get an answer: gh workflow run deploy.yml
# A scheduled build counts as a dispatched one here: it is the build that
# nobody is standing over, so cancelling it is how the four-day gap happens
# again on a busy afternoon.
concurrency:
  # A run dispatched on a branch builds and runs QA, and the github-pages
  # environment refuses its deploy (main only). It gets a group of its own so a
  # scheduled or manual run of main never replaces it while it waits, and it
  # never holds up main's (2026-09-24, a branch check was cancelled twice).
  group: pages-${{ github.event_name == 'push' && 'push' || (github.ref == 'refs/heads/main' && 'manual' || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the sitemap dates every page from the last commit
          # that touched its source, and a depth-1 checkout would date all
          # 1,222 of them from today, which is the bug this replaced.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # Every ratchet in preflight.py ran only when a human typed the command
      # until 2026-08-13, which means the id-prefix check, the how_to_recognise
      # limits, the contract-B check and the pin-upgrade check were advice
      # rather than gates. A check nobody runs is not a mechanism. It goes
      # before the build because it reads the data files the build turns into
      # pages, so a failure here is cheaper than a failure after.
      - name: Preflight the data
        run: python3 scripts/preflight.py

      # The same argument, one layer over: i18ncheck.py has enforced Contract J
      # since the seven languages landed and nothing ever ran it, so on
      # 2026-09-01 twelve of twenty-three overlays promised a tree count the
      # city did not have. Amsterdam's Dutch title still said "de 39 mooiste"
      # after five trees came off and its English copy was corrected. The build
      # already refuses an untranslated tree; it could not see a translated
      # page lying about how many there are.
      - name: Check the translation overlays
        run: python3 scripts/i18ncheck.py

      # working-directory matters beyond convention: data-dir.ts resolves
      # ../data from process.cwd(), so astro build must run with site/ as
      # cwd or every content-collection read breaks.
      # Dates each page by when its CONTENT last changed, so the sitemap's
      # lastmod stays credible (2026-09-04: half the site claimed to change
      # in one day because two scripts rewrote files without changing pages).
      # Not committed here; nightly.yml commits the map so the record lasts.
      - name: Date the pages that changed
        run: python3 scripts/lastmod.py --write

      - name: Build site
        working-directory: site
        run: npx astro build

      - name: QA the built site
        run: python3 scripts/qa.py

      # THE PHONES, which nothing here used to think about.
      #
      # The app reads five of these feeds off the live site and this workflow
      # runs several times a day. A field that disappears or changes type breaks
      # every installed copy at once, and silently: the app fails safe and keeps
      # the data it already had, so nobody crashes and nobody reports anything
      # while every phone in the world quietly stops updating.
      #
      # It compares what is about to be published against what is live right
      # now, so there is no second copy of the feed shape to drift. Additions
      # are ignored and happen weekly; removals and type changes are the event.
      # The authoritative check is the app's own decoder in
      # AncientTreesTests/LiveFeedContract.swift; this is the early warning, at
      # the moment the change is made.
      - name: Will the app still read these feeds
        run: python3 scripts/feedshape.py --dist site/dist

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
