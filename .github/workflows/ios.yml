# The gate the app did not have.
#
# The website cannot deploy with a red test. The app had nothing at all between
# a push and Hidde's phone, and on 2026-08-20 that showed: he found three real
# bugs in one evening and I found none, including one where tapping a tree card
# did nothing because a drag gesture had a four point threshold. Nine tests
# existed and ran only on my machine, which is the same as not existing.
#
# Free because the repository is public: GitHub does not bill macOS minutes for
# public repos, so this costs nothing and needed no ruling from Hidde.
#
# WHAT THIS CANNOT DO, said here so nobody trusts it further than it goes. It
# builds and taps; it cannot feel. Both of the freezes he found were smooth in
# the simulator and instant on a phone, because a runner has a Mac's processor
# and a Mac's network. Stutter, jank and "this does not feel right" stay his,
# and that is the argument for TestFlight rather than against this.

name: iOS app

# The scripts are part of the gate, so editing one has to re-run it. Added
# 2026-08-25: appfit.py, appsweep.py and layout_rules.py decide what counts as a
# layout fault, and a change to any of them would otherwise ship without the
# check it changes ever running once.
on:
  push:
    paths:
      - 'ios/**'
      - 'scripts/appfit.py'
      - 'scripts/appsweep.py'
      - 'scripts/layout_rules.py'
      - 'scripts/netcheck.py'
      - 'scripts/refused.py'
      - 'scripts/worktree_guard.py'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/appfit.py'
      - 'scripts/appsweep.py'
      - 'scripts/layout_rules.py'
  workflow_dispatch:

  # TWICE A DAY, WHATEVER ELSE HAPPENS, and this is the piece that was missing.
  #
  # Measured 2026-08-27: the last seventeen finished runs of this workflow were
  # ALL cancelled and not one had passed. Not because the app was broken, but
  # because the gate could never reach the end. A run takes 40 to 75 minutes and
  # an afternoon of app work pushes more often than that, so every run was killed
  # by the next push. Nobody read the verdict because there was no verdict, and a
  # real bug sat inside it for three days.
  #
  # The cancelling is still right for a busy branch: a verdict on a commit that
  # has already been replaced is not worth a runner's half hour. So it stays, and
  # a scheduled run is given a concurrency group of its own that a push cannot
  # touch. At least twice a day something actually finishes and says yes or no.
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 17 * * *'

# A newer push cancels the run before it: this is a gate on the newest code,
# and a verdict on a commit that has already been replaced is not worth a
# runner's half hour. It is only half of why the first two days showed no
# green, though: the longer "cancelled" runs died of the job timeout below,
# which was 30 minutes for a job whose test step alone takes 17 to 29 (the
# retry of a failing test doubles the slow half), and a timed-out job is
# listed as "cancelled" as well.
#
# The scheduled runs above sit in their own group and are never cancelled, so
# the workflow always has a recent finished verdict to read.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  test:
    runs-on: macos-15
    # Measured on the green run of 2026-08-29, step by step, because the old
    # figures here were a year of screens out of date and were the reason the
    # scheduled runs kept dying:
    #
    #   build and test          15.5 min
    #   RefusedWalk              7   min
    #   appfit, both phones     24   min   <- the biggest step, and it grows
    #   appsweep screenshots     7.5 min
    #   ---------------------------------
    #   whole job              ~55   min on a fast runner
    #
    # The ceiling was 75, so there was twenty minutes of headroom on a job
    # whose runner speed varies by more than that. That is the whole bug: a
    # hand-started run lands on a warm fast runner and goes green, the 05:00
    # and 17:00 ones sometimes land on a slow one and get killed at 75, which
    # GitHub reports as "cancelled" rather than as a timeout. Nothing was
    # actually broken in the app, and reading the alarm literally sent two
    # sessions looking for a fault that was not there.
    #
    # 110 gives an hour of slack instead of twenty minutes. It costs nothing:
    # this repository is public, so Actions minutes are free.
    #
    # AND THAT GROWTH ITEM ARRIVED, so the job is split rather than the number
    # raised again (2026-08-30). The sentence that used to end this comment
    # said: when appfit passes 40 minutes, split the job in two. A run then
    # took 1h45m and was killed at 110 with Build and test, Verdict and the
    # refused walk all GREEN and only the looking half unfinished, which is the
    # worst possible shape: everything that judges the app had passed and the
    # gate still reported red.
    #
    # So there are two jobs now, running side by side on their own runners.
    # `test` answers "does the app work" in about an hour. `look` answers "does
    # it line up, and what do the screens look like" in about the same. Wall
    # clock is the slower of the two rather than the sum, and each gets a
    # timeout it can actually finish inside. Free, because this repository is
    # public. `look` builds the app again, which is the price of running them
    # in parallel and is worth it: a green verdict on the app no longer waits
    # on a screenshot sweep.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      # Cheapest first, and no simulator needed: the sweep's screen list and the
      # layout gate's screen list must be the same list. They drifted twice
      # (2026-08-25) and the cost was a screen photographed under a name that
      # overwrote another screen's picture, so the Collection tab went a day
      # unlooked at while a file with its name sat in the folder.
      - name: Do the two screen lists agree
        run: python3 scripts/appsweep.py --check-lists

      # Cheaper still, and it catches the one fault that stops a release before
      # review even starts: an app icon with an alpha channel is refused by App
      # Store Connect on upload. Ours had one, unnoticed, until 2026-08-27.
      - name: Will Apple take the app icon
        run: python3 scripts/icon_check.py

      # Also free, also no simulator, and it guards the thing every failure test
      # in this repository stands on: the app reaches the network through
      # Kit/Net.swift and nothing else. A call made straight on URLSession.shared
      # cannot be intercepted, so no test can ever take the network away from it.
      # Two files that landed the same afternoon the door was built carried nine
      # such calls (2026-08-27), written against the old habit, and nothing said
      # so: the tests just quietly did not cover them.
      - name: One door to the network
        run: python3 scripts/netcheck.py

      - name: Which Xcode
        run: |
          # THE NEWEST ONE ON THE RUNNER, and say which, out loud.
          #
          # This pinned Xcode_26.6.app and swallowed the failure with `|| true`,
          # so when the image did not have it the gate quietly fell back to
          # Xcode 16.4 and kept a green face. That is worse than a red build:
          # it compiled against an SDK two major versions behind the one this
          # app is written on, so anything newer than iOS 18 failed here and
          # nowhere else, with nothing in the log saying why (2026-08-26,
          # ToolbarSpacer).
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer" || true
          fi
          echo "Using: $(xcode-select -p)"
          xcodebuild -version

      # Chosen by UDID from what is actually BOOTABLE, not by name from a list
      # that includes runtimes the runner does not have. The first version of
      # this picked "iPhone SE" out of an old section and xcodebuild replied
      # that no device matched at all.
      - name: Pick a simulator
        id: sim
        run: |
          # By UDID, from what is actually available, taking the LAST match:
          # simctl lists runtimes oldest first, so the last iPhone is the newest
          # iOS. The first version picked a name out of the text and xcodebuild
          # replied that no device matched, because the name came from a runtime
          # the runner does not have.
          find_udid() {
            xcrun simctl list devices available \
              | grep "iPhone" \
              | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}" \
              | tail -1
          }
          UDID=$(find_udid)
          if [ -z "$UDID" ]; then
            echo "No iOS simulator runtime here. Fetching one, slow but once."
            xcodebuild -downloadPlatform iOS || true
            UDID=$(find_udid)
          fi
          if [ -z "$UDID" ]; then
            echo "Still nothing. Everything this runner has:"
            xcrun simctl list devices
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -B20 "$UDID" | grep "^-- " | tail -1
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and test
        run: |
          set -o pipefail
          # The whole log goes to a file and only the interesting lines to the
          # console. SweepFrames is skipped here and run by the layout step
          # below instead: it takes two minutes, its measurements never appear
          # in this log whatever we do with grep, and the step that needs them
          # runs it properly.
          #
          # One simulator at a time. Left to itself xcodebuild clones the
          # simulator and runs the two UI test classes side by side, and on
          # this runner two apps launching at once took 60 to 110 seconds
          # each and then "did not have a process ID": the first run whose
          # real tests all passed (2026-08-21) went red on that alone. Serial
          # costs a few minutes and measures the app instead of the runner.
          xcodebuild test \
            -project ios/AncientTrees/AncientTrees.xcodeproj \
            -scheme AncientTrees \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath /tmp/dd \
            -retry-tests-on-failure -test-iterations 2 \
            -skip-testing:AncientTreesUITests/SweepFrames \
            -skip-testing:AncientTreesUITests/RefusedWalk \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > /tmp/xcodebuild.log 2>&1 || true
          grep -E "Test case|error:|warning: .*deprecat|\*\* (TEST|BUILD)" /tmp/xcodebuild.log || true
          # SAY WHICH KIND OF RED THIS IS.
          #
          # A test target that does not COMPILE produces a result bundle with
          # nothing in it, and the Verdict step below then reports "0 passed, 0
          # failed" and fails. That is true and it is the wrong sentence: it
          # reads as "somebody deleted the tests" when it means "the app does
          # not build". It cost a session real time on 2026-08-26, chasing a
          # missing suite that was never missing, while the actual cause sat in
          # this log as one compiler error. Strict concurrency is the usual
          # culprit, because a permissive local Debug build waves through what
          # this job refuses (see SpeciesGlyph and handleTap in TreeMap.swift).
          #
          # AND IT ANSWERED "DID NOT COMPILE" TO EVERYTHING, which is the same
          # mistake pointing the other way. The test above was `grep -q
          # "error:"`, and XCTest writes a failed assertion as
          # `AncientTreesUITests.swift:432: error: -[...] : failed - ...`. So
          # every ordinary test failure was announced as a build that never
          # happened, and on 2026-08-30 a red pin test sent a session looking
          # for a compiler error that did not exist (2026-08-30).
          #
          # The two are told apart by the COLUMN. A compiler names file, line
          # and column; XCTest names file and line only. Linker and driver
          # errors carry no file at all, hence the second alternative.
          COMPILE_ERR=':[0-9]+:[0-9]+: error:|^(ld|clang)(\+\+)?: error:|^error:'
          if grep -qE "$COMPILE_ERR" /tmp/xcodebuild.log; then
            echo "::error::The app did not compile, so no test could run. The compiler errors are above."
            exit 1
          fi
          if grep -q "error:" /tmp/xcodebuild.log; then
            echo "::error::The app built. Tests FAILED, named below. This is not a build problem."
            grep -E ": error: -\[" /tmp/xcodebuild.log | sed 's/^.*: error: //' | sort -u
            exit 1
          fi
          # grep swallows the exit code, so ask xcodebuild again for the verdict.
          test -f /tmp/dd/Logs/Test/*.xcresult 2>/dev/null || true

      # The result bundle, so a failure on the runner can be read from this
      # Mac: XCTest photographs the screen at every failed assertion and the
      # bundle carries the frames, the app's log and the crash, none of which
      # reaches the console. The CI's SE-only failures of 2026-08-21 cost a
      # local SE reproduction to understand because this did not exist.
      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_id }}
          path: /tmp/dd/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Verdict
        run: |
          R=$(ls -td /tmp/dd/Logs/Test/*.xcresult 2>/dev/null | head -1)
          if [ -z "$R" ]; then echo "no test results were produced"; exit 1; fi
          xcrun xcresulttool get test-results summary --path "$R" > /tmp/summary.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/summary.json"))
          passed, failed = d.get("passedTests", 0), d.get("failedTests", 0)
          print(f"{passed} passed, {failed} failed")
          for f in d.get("testFailures", []):
              print("FAILED:", f.get("testName"), "-", f.get("failureText", "")[:200])
          raise SystemExit(1 if failed or passed == 0 else 0)
          PY

      # THE STATE EVERY OTHER TEST AVOIDS: permission refused.
      #
      # Every UI test in this repository launches with -at=, a fixed location
      # that always works, which is the right default for testing everything
      # else and meant the most common real-world state on a phone had never
      # been entered once. This revokes location and photos on the simulator so
      # the app's real Core Location code takes its real refused branch, then
      # puts them back, because a simulator left refused makes every other test
      # here fail in a way that looks like a bug in the app.
      #
      # Separate from the run above because it has to change the device between
      # the two, and because a refused run that dies must not take the ordinary
      # verdict with it.
      - name: What happens when somebody says no
        if: always()
        run: python3 scripts/refused.py --udid "${{ steps.sim.outputs.udid }}"

  # THE LOOKING HALF, on its own runner beside the one above.
  #
  # Split out on 2026-08-30 because together they outgrew the job timeout. It
  # needs no `needs:` on the test job: a layout finding is worth having even
  # when a test failed, which is why these steps carried `if: always()` when
  # they lived there. Running in parallel keeps that property and stops the
  # slow half deciding whether the fast half gets to report.
  look:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Which Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer" || true
          fi
          echo "Using: $(xcode-select -p)"

      # The app MEASURED its own layout since 2026-08-20 and judged none of it:
      # SweepFrames printed the frames, the grep above threw them away, and the
      # run went green with a heading four points off the card under it. This is
      # the step that reads them, and it applies the same three rules the
      # website's smoke test applies to rendered pages, from the same file
      # (scripts/layout_rules.py). Hidde, 2026-08-20: "kun je vervolgens zorgen
      # dat de CI voor app en web dezelfde kwaliteit nastreven."
      #
      # It runs even when the tests failed, because a layout finding is worth
      # having in the same log as the failure that hid it.
      - name: Does it line up (CLIPPED / DRIFT / SMALL)
        if: always()
        run: |
          # appfit.py runs the sweep ITSELF rather than reading it out of the
          # log above, and it has to. XCTest does not forward a test's standard
          # output to xcodebuild, so the <<<SWEEP markers this step used to look
          # for never reached the log on any machine: the step could only ever
          # print "no measurements" and fail. SweepFrames writes a file instead,
          # and appfit disables parallel testing so the file survives, because a
          # UI test otherwise runs on a throwaway CLONE of the simulator that is
          # deleted with the file inside it.
          # EVERY phone, not one. It measured only the smallest until
          # 2026-08-25, and the big one was carrying four findings nobody had
          # ever seen, one of them a button a point under Apple's floor. With no
          # --device it walks appsweep's own list and creates what the runner
          # does not have.
          python3 scripts/appfit.py

      # THE EYES LAYER, as far as a runner can carry it (2026-08-25, on Hidde
      # asking whether the app can have the website's QA). It cannot judge
      # whether a screen is any good, and it can put every screen of both phones
      # in an artifact so that judging them needs a browser rather than a Mac
      # with Xcode on it. The website's fourth layer is a human walk and so is
      # this; what changed is that the pictures now exist without one.
      - name: Photograph every screen
        if: always()
        # ONE phone here, the smallest. Two took over thirty minutes on the
        # runner (2026-08-25) for pictures nobody looks at per push: the reason
        # they exist in CI is the nightly reviewer, which reads the SE set and
        # only ever six of them. appfit still measures BOTH phones, because that
        # half is mechanical and needs no eyes. A session sweeps both.
        run: python3 scripts/appsweep.py --no-build --device "iPhone SE (sweep)" || true

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appsweep-${{ github.run_id }}
          path: /tmp/appsweep/**/*.png
          retention-days: 14
          if-no-files-found: warn

      # The frames the step above judged, so a finding can be read from this
      # Mac without re-running the sweep here. The 'Seen' drift of 2026-08-21
      # was only explicable with the elements around it.
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appfit-dump-${{ github.run_id }}
          path: /tmp/appfit-dump.txt
          retention-days: 7
          if-no-files-found: ignore
