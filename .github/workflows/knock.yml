name: Knock watchdog

# GitHub is not delivering the night shift's cron, and the shortfall is the
# single biggest loss in the machine's day. Measured 2026-08-29: since the
# twelve-knock cron went live at 11:45 UTC on 08-28, ELEVEN scheduled knocks
# were due and TWO arrived. data-digest.yml's own watchdog note recorded the
# same on 08-27 and 08-28, 2 of 12 both days, and it could not fix it: that
# watchdog runs once a day at 05:15, so it can rescue at most one knock in
# twenty-four hours.
#
# What is actually happening is documented GitHub behaviour rather than a bug
# here: a scheduled run is delayed under load, and when the delay reaches the
# next slot the delayed one is DROPPED. The observed arrivals are 1h44 and
# 34 minutes late, so the delays are already the size of the spacing.
#
# A workflow_dispatch is never dropped. So this job runs often, costs about
# fifteen seconds of a runner, and turns unreliable delivery into reliable
# dispatch. It does not raise the ceiling: the three guards below hold the
# same shape the cron asks for, twelve knocks a day, two hours apart, never
# stacked on a run that is already working.
#
# This is a watchdog and not a chain. Self-chaining stays off (nightly.yml,
# 2026-07-31): a chain re-fires the moment a run ENDS, which is what spent
# ~940 minutes in one day. This fires only when nothing has started for two
# hours, which is exactly the gap the cron was supposed to fill.

on:
  schedule:
    # Every twenty minutes, and deliberately off the hour boundary. Each firing
    # is an independent chance; the guards decide whether anything happens.
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: knock-watchdog
  cancel-in-progress: true

jobs:
  knock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Guard 0, and it is the one that keeps this from repeating 2026-07-31.
      # The knocks are free; the WINDOWS are not. Measured 2026-08-29 from the
      # rolling seven-day total in data/run-health.json: it crossed 1,000
      # minutes on 08-23 and every knock for the next two and a half days died
      # in seconds on the usage limit. Three days of no machine at all, bought
      # by one good night. So this watchdog stops rescuing knocks once the week
      # is spent, and the cron alone decides what still gets through.
      #
      # It checks the DAY as well as the week, because a weekly figure on its
      # own front-loads: twelve rescued knocks would spend the thousand minutes
      # by Wednesday and leave the back half of the week dark. A seventh a day
      # is still a full window plus change, and it arrives every day.
      - name: Is there any budget left
        id: week
        run: |
          if python3 scripts/run_health.py --week; then
            echo "room=yes" >> "$GITHUB_OUTPUT"
          else
            echo "room=no" >> "$GITHUB_OUTPUT"
          fi

      # THE DAILY REVIEW COMES BEFORE NEW COVERAGE, and this step is why the
      # fresh-eyes review failed on eight of its nine scheduled attempts
      # between 19 and 23 September and left four days with no entry at all.
      #
      # The failures were not broken code. Eight of them are the fingerprint
      # this corpus already names for a night run that meets a spent
      # allowance: one turn, zero dollars, subtype success with is_error true,
      # the agent having started, asked and been refused. review.yml's own
      # comment says its second cron sits in "the only window the night chain
      # leaves alone (it fires every two hours from 18:00 to 10:00 UTC)". That
      # stopped being true on 2026-08-28, when the knocks went to twelve a day
      # round the clock and this watchdog started making sure they arrive.
      # There is no quiet window any more, so the review was competing with
      # the night shift for the same allowance twice a day and losing.
      #
      # The ordering is CLAUDE.md's own: a broken site is rung 2 and new
      # coverage is rung 4. So on a day with no review yet, this dispatches
      # one and does NOT dispatch a night run in the same cycle, which is the
      # half that actually frees the allowance. A dispatch is also never
      # dropped, so it fixes the delivery half at the same time.
      #
      # Two bounds, because a rule that yields forever is a rule that stops
      # the machine: nothing before the review's own first slot, and at most
      # six attempts a day, after which the night shift resumes and the review
      # waits for tomorrow rather than eating the week.
      - name: The day's review goes before the night shift
        id: review
        if: steps.week.outputs.room == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          if grep -qE "^## $TODAY" REVIEW.md 2>/dev/null; then
            echo "today is already reviewed"; exit 0
          fi
          if [ "$(date -u +%-H)" -lt 7 ]; then
            echo "before the review's own 06:10 slot; leaving it to the cron"; exit 0
          fi

          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/review.yml/runs?per_page=20" 2>/dev/null || echo "")
          if [ -z "$RUNS" ]; then echo "no review history readable; nothing to do"; exit 0; fi

          INFLIGHT=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$INFLIGHT" -gt 0 ]; then
            echo "a review is in flight; holding the night shift back"
            echo "yield=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi

          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          TRIED=$(echo "$RUNS" | jq "[.workflow_runs[] | select(.created_at > \"$SINCE\")] | length")
          echo "$TRIED review attempts in the last 24h"
          if [ "$TRIED" -ge 6 ]; then
            echo "six attempts is enough for one day; the night shift resumes"; exit 0
          fi

          LAST=$(echo "$RUNS" | jq -r '.workflow_runs[0].created_at // empty')
          if [ -n "$LAST" ]; then
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST" +%s) ))
            echo "last review attempt $(( AGE / 60 ))m ago"
            # An attempt refused on the allowance needs the allowance to come
            # back, and that takes hours rather than minutes. Retrying sooner
            # buys nothing and spends the day's six attempts before lunch.
            if [ "$AGE" -lt 5400 ]; then
              echo "inside the ninety-minute spacing; holding the night shift back"
              echo "yield=yes" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          echo "no review for today; dispatching one and standing the night shift down"
          gh workflow run review.yml -R "${{ github.repository }}" \
            && echo "yield=yes" >> "$GITHUB_OUTPUT" \
            || echo "dispatch failed; the night shift may go ahead"

      - name: Dispatch a night run when the cron dropped one
        if: steps.week.outputs.room == 'yes' && steps.review.outputs.yield != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?per_page=40" 2>/dev/null || echo "")
          if [ -z "$RUNS" ]; then echo "no nightly history readable; nothing to do"; exit 0; fi

          # Guard 1: never stack on a run that is queued or working. The
          # concurrency group on nightly.yml does not cancel, so a stacked
          # dispatch would just sit behind it and GitHub keeps only the newest
          # pending one, which throws the knock away.
          INFLIGHT=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$INFLIGHT" -gt 0 ]; then echo "a night run is in flight; nothing to do"; exit 0; fi

          # Guard 2: the knock spacing. Two hours is the floor set in
          # nightly.yml, because the job cap is 120 minutes.
          LAST=$(echo "$RUNS" | jq -r '.workflow_runs[0].created_at // empty')
          if [ -n "$LAST" ]; then
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST" +%s) ))
            echo "last night run started $(( AGE / 60 ))m ago"
            if [ "$AGE" -lt 7200 ]; then echo "inside the two-hour spacing; nothing to do"; exit 0; fi
          fi

          # Guard 3: the day's ceiling, so a broken guard above cannot run away.
          # Twelve is what the cron asks for and this never exceeds it.
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          FIRED=$(echo "$RUNS" | jq "[.workflow_runs[] | select(.created_at > \"$SINCE\")] | length")
          echo "$FIRED knocks arrived in the last 24h"
          if [ "$FIRED" -ge 12 ]; then echo "the day is full; nothing to do"; exit 0; fi

          echo "no knock for over two hours; dispatching one"
          gh workflow run nightly.yml -R "${{ github.repository }}" \
            && echo "dispatched" || echo "dispatch failed; the cron remains the fallback"
