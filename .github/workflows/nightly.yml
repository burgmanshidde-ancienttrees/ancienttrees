name: City research

on:
  schedule:
    # Two rhythms, set 2026-07-26 now that Hidde is back and talking to
    # Claude daily. Daytime (07-19 UTC, roughly 09:00-21:00 Amsterdam) belongs
    # to him: the chain pauses, only this sporadic cron knocks, and a run that
    # hits the usage limit exits instead of camping on the window. Night is the
    # machine's: the self-dispatch chain runs continuously. The 19:05 UTC entry
    # is the evening igniter that reliably relights the chain after the pause;
    # the */20 knock covers GitHub's habit of dropping schedules.
    # Throttled 2026-07-31 (Hidde: nearly at the weekly limit on day 2 of 7).
    # Was */20 plus a self-dispatch chain, which spent ~940 minutes in a
    # single day. Four knocks a day, no chaining: the machine still works
    # every night, it just stops eating the week in two days. Raise this
    # back up when the limit stops being the constraint.
    # 2026-07-31 second tune: six knocks a day, but the real lever is
    # below: timeout-minutes 60 caps every run to one hour, so a day
    # of machine work tops out at ~6 hours instead of yesterday's 16.
    # 2026-07-31 evening trim: 63% of the week gone at day 2.5 of 7 with
    # heavy session days; four one-hour runs (~4-5%/day) leaves daily
    # session room. Recalibrate at Monday's usage glance.
    # 2026-08-04, fresh week, Hidde at 2% on day one and asking for more
    # machine time while staying deliberate. Six knocks: 23:00, 01:00, 03:00,
    # 05:00, 07:00 and 09:00 CEST, each capped at 60 minutes by
    # timeout-minutes below. The arithmetic behind the number: four runs cost
    # roughly 4-5% of the week per day, so six lands near 6-7%, about 45% over
    # seven days, which leaves his own sessions the larger half. The last two
    # reach into the morning on purpose; the presence beacon pauses the chain
    # for four hours the moment he opens a session, so they yield to him
    # automatically. Recalibrate at Monday's usage glance.
    # 2026-08-08, Hidde: "add 3 more for tonight". Nine knocks instead of six,
    # every 90 minutes from 22:30 to 10:00 CEST, each still capped at 60
    # minutes by timeout-minutes below. Arithmetic, so the next recalibration
    # is not guesswork: six runs cost roughly 6-7% of the week per day, so nine
    # lands near 10%, about 70% over seven days if it ran every day. It should
    # NOT run every day at this rate. Drop back to the six-knock line below the
    # moment the weekly limit tightens, which is the same lever pulled on
    # 2026-07-31 when the week was being eaten in two days.
    #     six-knock fallback:  - cron: "0 1,3,5,7,21,23 * * *"
    # 2026-08-16, Hidde: "minder en langer, is goed". SIX knocks of NINETY
    # minutes, replacing nine of sixty. The ceiling is deliberately unchanged,
    # 6 x 90 = 540 minutes a day against 9 x 60 = 540, so this is a
    # redistribution of the same budget and not a request for more of it.
    #
    # The measurement behind it, from the night of 2026-08-15/16: eight runs
    # produced 28 trees, and the SINGLE run that reached the 60-minute cap
    # produced 17 of them. The 20-minute runs produced 6, 0 and -2. Output is
    # strongly superlinear in run length, because every run pays the same
    # fixed orientation cost (read the corpus, check the rungs, pick a city)
    # before it can do anything, and a verify-then-write cycle does not fit in
    # twenty minutes. Nine knocks meant paying that fixed cost nine times for
    # 87 minutes of actual work.
    #
    # Three hours apart on purpose: a 90-minute run always finishes before the
    # next knock, so the concurrency group never queues one behind another.
    # Cron reliability is NOT the reason for any of this and never was; all 12
    # knocks measured on 2026-08-16 fired on schedule, which retires the older
    # note in this file about GitHub dropping 5-7 of 9.
    # 2026-08-18, Hidde: "deze week ben ik van plan vooral aan de app te werken
    # en zelf weinig te initieren rondom data ophalen - zullen we meer runs
    # laten starten in github om wel genoeg steden binnen te laten komen?"
    #
    # NINE knocks, every two hours from 18:00 to 10:00 UTC, still capped at 120
    # minutes each. The reason this is safe THIS WEEK and not in general: the
    # constraint on usage has never been the ceiling, it has been the runs
    # stalling. Measured the night of 08-17/18: four runs, 68 minutes used of a
    # possible 720, three of them producing nothing. So the ceiling is
    # theoretical and more knocks mainly buys more chances at a window that
    # works. What makes it safe is that he is not competing for the window
    # himself this week; the moment he is back on heavy sessions this drops
    # back to six, which is the line below.
    #     six-knock line to restore:  - cron: "0 20,23 * * *"
    #                                 - cron: "0 2,5,8,11 * * *"
    - cron: "0 18,20,22 * * *"
    - cron: "0 0,2,4,6,8,10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: nightly-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # GitHub allows six hours per job; we take 120 minutes.
    #
    # 2026-08-17: raised from 90, one night after 90 replaced 60, because the
    # cap has now cut off the best run on two consecutive nights. On 08-16/17
    # the run that reached the 90 minute cap produced 19 of the night's 20
    # trees and opened two countries (Graz, Bratislava) before it was killed
    # mid-work. Raising it costs far less than the ceiling arithmetic suggests:
    # actual use that night was 126 minutes of a possible 540, because three of
    # four runs stalled early, so the cap binds exactly one run per night and
    # this buys that one run another half hour. If the stalls get fixed the
    # ceiling starts to matter and this is the first number to pull back.
    #
    # The history, kept short: 60 from 2026-07-31 (a chaining day had eaten the
    # week in two), 90 on 2026-08-16 paired with the drop from nine knocks to
    # six so the ceiling held at 540, and 120 now. Each step was taken for the
    # same reason and the reason keeps being true: a cap that binds the best
    # run is protecting the wrong thing.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The night run's own self-check builds via Astro now (npx astro
      # build), and site/package.json demands Node >=22.12 - Vite treats
      # that floor as a hard failure, not a warning. Without this, the
      # first run after the Python renderer's deletion fails at its own
      # self-check on whatever Node the runner image happens to ship.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Where the run started, so the Run health step below can say what it
      # actually produced instead of asking it. Cheap and unconditional.
      - name: Mark the starting point
        id: start
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_OUTPUT"

      - name: Run the research workflow from CLAUDE.md
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # The runs' eyes: lets a run read the visitor trend itself via
          # scripts/visitors.py and carry it into LOG.md. Absent secret = the
          # script prints one line and the run continues blind, never broken.
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          # Reader submissions intake (native form -> Supabase). Absent secret
          # = runs skip reading submissions, never broken. Hidde adds it as a
          # GitHub secret when he is ready to open the tap.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Account id, not a secret: it appears in every dashboard URL.
          CF_ACCOUNT_TAG: "949aa102070e5f296c9cc0d5bc1e1891"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running the autonomous research workflow for the Ancient Trees
            project. Read CLAUDE.md in the repository root and execute "The research
            workflow (autonomous run)" exactly as written.

            Begin every run with: python3 scripts/visitors.py, then
            python3 scripts/prepare.py. The second one stocks the staging
            shelf (register candidates for the next sprint cities, deduped
            and annotated) and prints the state of the whole line: what is
            staged for a verify pass and what verified trees await a writer.
            It is deterministic and costs nothing, so preparation never
            spends your window; your hour goes to verify and write work
            taken FROM that shelf. Prefer finishing what is already staged
            or verified over starting anything fresh. Carry its 7-day
            visits line into your LOG.md entry, and let it steer depth choices
            (deepen what people actually visit). If it says no token or refuses,
            skip it silently and work on.

            Step 0 holds a priority ladder; work out which rung applies and do that.
            Reader submissions outrank everything. Something published being wrong
            outranks everything below it.

            WHAT KIND OF WORK, and this prompt deliberately does not say. Read
            CLAUDE.md's "The course after the fortnight" paragraph in Step 0 and
            follow it; it holds the two rules (supply from the cheap end, depth
            only where there is demand) and it is the ONLY place they live.
            This prompt used to restate the phase as well, which is exactly how
            the superseded 2026-08-06 tourist-city rollout was still being
            executed here six days after CITY_QUEUE.md replaced it: two copies of
            a course means the one nobody edits wins. So strategy lives in
            CLAUDE.md and CITY_QUEUE.md, and this prompt carries only what is
            true of THIS RUNNER and nothing else knows.

            Runner facts, which are the reason this prompt exists at all:
            - NEVER judge or approve a photo here. This runner's egress proxy
              blocks upload.wikimedia.org and api.openverse.org, so 313 of 337
              candidates were unreachable on 2026-08-07 and a whole window went
              on discovering that. Viewing works only in Hidde's own sessions.
              Running the free API sweep (scripts/photo_hunt.py --recheck) is
              fine here and fills the queue for one of those sessions.
            - Verify with `npm --prefix site ci` then `npm --prefix site run
              build`. Both start with npm on purpose: a parenthesised subshell
              like `(cd site && ...)` matches no entry on the tool allowlist and
              is what silently stopped every night run for a day.
            - Every fetch gets a hard timeout (`curl -m 20`). A host that hangs
              costs the whole window; data/fetch-blocklist.json lists the known
              ones and passcheck.py prints it.

            APPEND TO LOG.md BEFORE YOU EXIT, always, and above all when you
            shipped nothing. Two or three sentences: which rung you picked, which
            city and why, what you actually did, and where it stopped. A run that
            ends with only a claim commit and no log entry is invisible: on
            2026-08-13 a run correctly picked Como off the queue, claimed it,
            spent 54 turns and produced nothing else, and nobody could tell from
            the repository whether it had failed, been blocked or simply been
            cut off. Hidde reads LOG.md cold, so "I tried X, it stopped at Y" is
            worth more to him than silence. If a tool call was refused, say which
            command; the workflow log does not record that and you are the only
            witness.

            PAGE GAPS ARE PART OF THE WORK, not a separate project. Run
            `python3 scripts/pagegaps.py` in every run. It prints the species,
            country and park pages the data has earned and nobody has written,
            biggest first, and every one of them is an entry from Google that
            does not exist while its trees do. Writing an intro is small, cheap
            and entirely inside the assembly line: batch several into one pass
            per the writing brief, exactly as you would batch tree stories. The
            rule that governs them, and it is the only one that matters here:
            each intro is written from that subject's own trees, never from a
            pattern, because thirty identical paragraphs are worse than none.
            Prefer a gap with many trees behind it, and treat opening a new city
            as also opening its country page if that country has none.

            LOG WHAT THE PASS COST, in the same commit as its output: append to
            data/agent-costs.json under today's date with target, kind (verify,
            write, photo, scout), tokens, trees that actually reached
            data/cities, and a one-line note. An unlogged pass is a day the
            learning loop cannot see, and the meter CLAUDE.md says to watch
            weekly has already gone blind twice by other routes (a hardcoded
            kind, then a wrapped shape). Log session work too, with tokens 0 and
            a note saying so, rather than leaving the day empty: an empty day and
            a quiet day look identical in RETRO.md otherwise.

            Order of cities: run `python3 scripts/city_queue.py --next`. It
            prints the cities below their tree target in queue order, with the
            gap and what supply is already on disk, from data/city-queue.json,
            which is the source file for both the order and the target. Take the
            top one you can move cheaply and STOP AT THE TARGET: leftover
            candidates stay leads. Do not use any city order remembered from
            this prompt or from CLAUDE.md, and do not deepen a city that has no
            target. LONDON IS GATED: never research it and never touch Woodland
            Trust ATI data.

            Before dispatching or starting any pass on a place, claim it:
            python3 scripts/passcheck.py --claim <place> --kind verify, commit
            and push the claim, and respect a refusal. A session and a night run
            wrote the same nine stories on 2026-08-06; the claim file is the fix.
            CLAIM ONLY WHAT THIS WINDOW CAN FINISH, and merge per city as you
            go. On 2026-08-13 one run claimed fourteen cities, assembled
            eighteen trees, and published zero: the hour ran out mid-write and
            the whole top of the queue sat locked behind expiring claims. A
            city merged, built and pushed is worth more than three assembled,
            so the loop is: claim one small batch, write it, merge it, run the
            build, commit, release, and only then claim the next.

            What a good city run produces, and it is one city done properly:
            - Between 8 and 10 highlighted trees for an ordinary city, and for a
              large one two or three clusters of 6 to 8 rather than a long list.
              A cluster is trees within roughly 2 km of each other, because the
              walk is the product; the measured proof is Cadiz at 600 metres
              reading as a good afternoon while Kyoto at 35 km does not.
            - The walking route the page generates must actually work. Check the
              km and minutes the build prints. If the route is 20 km, the trees
              were chosen wrong, not the route.
            - NO photo hunting inside research passes at all (assembly line
              rule 5, 2026-08-06, superseding the old 3-per-city cap). The free
              API sweep and the never-judge-here rule are under Runner facts
              above; a missing photo is an honest gap and always has been.
            - Everything found and not shipped goes to data/leads/[city].json in
              the two kinds, leads and blocked, per CLAUDE.md. Nothing gets
              thrown away, ever. Run python3 scripts/tree_index.py afterwards so
              the one database reflects the work.
            - Run python3 scripts/preflight.py before committing any change to
              data/cities/. It gates the deploy from 2026-08-13 onward, so a
              failure caught here costs seconds and a failure caught there costs
              the push.

            How to find the trees, in this order, because it is far faster than a
            web sweep: the country's official register if it has one (see
            OPEN_DATA_SURVEY.md; Portugal's ICNF and Japan's Environment Ministry
            giant-tree database are both cleared for use, Spain has regional and
            municipal catalogues), then the city's named parks and sacred ground,
            then the generic sweep for whatever is left. Use
            python3 scripts/cluster_register.py on a register to get the walkable
            groups before deciding which trees a city gets.

            There are no focus countries any more; CITY_QUEUE.md scores places
            individually and its order already reflects supply and demand. Do not start a city that already has a file
            in data/cities or that LOG.md shows in flight.

            Whatever the work turns out to be: verify against two independent
            sources, follow TONE_OF_VOICE.md and SEO_GEO_BLUEPRINT.md, set
            location_precision on every tree you touch, run
            `npm --prefix site ci` then `npm --prefix site run build` to
            confirm the site still builds and every contract validates (both
            start with npm on purpose: a parenthesised subshell like
            `(cd site && ...)` matches no entry on the tool allowlist and is
            what silently stopped every night run for a day), then commit,
            append to
            LOG.md, and push. The renderer is Astro now (site/), not
            build_site.py: that file no longer exists, having been deleted
            once deploy.yml's cutover ran a clean cycle (ARCHITECTURE.md's
            rollout plan, step 6). scripts/walk_planning.py still holds the
            city-loading and walk-planning code scripts/route_walks.py
            needs; nothing else survived the deletion.

            Respect every hard rule in CLAUDE.md, including the mandate: the two
            ranked goals, the three question test for anything nobody wrote a rule
            for, and the hard list of five things that stay closed.

            Getting through the usage limit at all is the rare event here, so do not
            stop after one item. When a piece of work is finished, committed and
            pushed, go back to Step 0, pick the next rung, and keep going until the
            usage limit stops you or the clock runs out.

            When every content rung is satisfied, the job continues: take the top
            item from PRODUCT_TODO.md and build it, under that file's rules
            (reversible only, contracts validate, done-when checked by build or
            grep, no visual-taste work, nothing from the hard list). The product
            is yours to improve, not only the data.

            Two rules on that, and they matter more than the throughput:
            - Finish and commit each item completely before starting the next. A
              half-researched city is worse than none. Never leave one part done.
            - Commit the smallest complete step the moment it exists, then build
              on it with further commits. A usage cutoff mid-item must only ever
              cost minutes, never the whole item (lesson of 2026-07-28, when a
              12-minute run died before its first commit and left nothing).
            - Start no new item after 5 hours. The job is killed at 345 minutes,
              and work killed mid-flight is work lost.
            - Usage-limit behaviour depends on the clock. Between 07:00 and
              19:00 UTC (Hidde's waking hours in Amsterdam) the window is his:
              work while it is open, but the moment you hit the limit, finish
              your commit and exit so his conversations get the room. Outside
              those hours, do not exit: wait for the rolling window to reopen
              and keep working through the night.
          # Permissions. This landed in three moves in one morning and the
          # middle one was wrong, so the reasoning is written out.
          #
          # The symptom: seven runs in a row committed a claim and nothing
          # else. Not the usage limit (they ended cleanly, 77-92 turns, real
          # money spent) and not a missing Task tool alone (adding it left the
          # denial count at exactly 17). The cause was that this workflow's own
          # prompt told the run to verify with `(cd site && npm ci && npx astro
          # build)`, a string beginning with a parenthesis, which matches no
          # Bash(cmd:*) prefix on any list however long. No build, so no
          # verification, so nothing publishable. The prompt above now says
          # `npm --prefix site ci` and `npm --prefix site run build`, which
          # match, and that is the actual fix.
          #
          # For a few hours this was instead "allow Bash, deny six things".
          # The fresh-eyes reviewer flagged that the same morning and was
          # right: a prefix denylist does not catch `find . -delete`,
          # `git clean -fdx`, `git reset --hard` or `python3 -c "shutil..."`,
          # and this is an unattended job holding WebFetch, so untrusted page
          # content reaches a context with a shell. Enumerated it is, then.
          #
          # Three additions to the original list, each demanded by a workflow
          # CLAUDE.md already mandates: Task (Step 1's verification and writing
          # passes, without which the assembly line is unreachable from the
          # machine meant to run it), curl (source fetching with the required
          # hard timeouts), and gh scoped to run/workflow only (Step 0 rung 2's
          # smoke-test check and stale-workflow redispatch). The denylist stays
          # as a second layer, not as the boundary: `Bash(python3:*)` has always
          # been arbitrary code execution, so neither list was ever a sandbox.
          # What actually bounds this job is that its token reaches one repo and
          # everything it does is in git history.
          #
          # Widened 2026-08-13, after a manually started run logged eight
          # permission denials in five minutes and produced one claim commit.
          # The additions are text and file plumbing every other pass here uses
          # freely: sed, awk, echo, jq, cut, tr, date, basename, dirname, cp, mv,
          # test. None of them widens what this job can reach, because
          # Bash(python3:*) has always been arbitrary code execution and the
          # boundary was never the list. Deliberately still absent: xargs and any
          # shell that takes a command string, because those turn one allowed
          # entry into all of them. The denylist below is unchanged.
          claude_args: |
            --allowedTools "Bash(git:*),Bash(python3:*),Bash(npm:*),Bash(npx:*),Bash(cd:*),Bash(curl:*),Bash(gh run:*),Bash(gh workflow:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*),Bash(sed:*),Bash(awk:*),Bash(echo:*),Bash(jq:*),Bash(cut:*),Bash(tr:*),Bash(date:*),Bash(basename:*),Bash(dirname:*),Bash(cp:*),Bash(mv:*),Bash(test:*),Task,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
            --disallowedTools "Bash(rm:*),Bash(sudo:*),Bash(gh repo:*),Bash(gh secret:*),Bash(gh auth:*),Bash(git clean:*),Bash(git reset --hard:*),Bash(find:* -delete)"
      # Continuous mode. GitHub fires the schedule only a handful of times a day
      # for this repo, so most open usage windows go unused. When a token is
      # present this step re-dispatches the workflow at the end of every run, so
      # the chain keeps itself alive independently of GitHub's flaky cron.
      #
      # Inert without the secret: no SELF_DISPATCH_TOKEN means this exits quietly
      # and the */20 cron remains the only trigger, so adding the step breaks
      # nothing. To turn continuous mode off later, delete the secret.
      #
      # The 10 minute throttle stops a closed usage window from becoming a tight
      # failure loop: a run that hits the limit dies in seconds, waits here, then
      # dispatches, so retries land about every 10 minutes rather than every few
      # seconds. Public repo, so the runner minutes this consumes are free.
      # Self-chaining has been OFF since 2026-07-31, when a chaining day spent
      # ~940 minutes and ate most of the week's usage in two days. The ten cron
      # knocks below the schedule block are the only trigger.
      #
      # It was off in a way that lied, which is why this step is now four lines.
      # Until 2026-08-12 the whole presence-beacon and throttle apparatus above
      # still ran, slept 10 to 30 minutes, and only THEN hit an
      # `echo ...; exit 0` sitting one line above the `gh workflow run` it was
      # meant to disable. So every run ended by sleeping for nothing, the
      # presence check it performed could not affect anything, and the code read
      # as a working chain to anyone skimming it. CLAUDE.md's capacity doctrine
      # still says "runs chain themselves around the clock"; that sentence has
      # been wrong for twelve days and is corrected there too.
      #
      # Turning it back on is Hidde's call, not a run's, because it is his usage
      # window: restore the presence-beacon version from git history
      # (this file as it stood before c034207) rather than rewriting it.
      # No run may end invisibly. Added 2026-08-15, after four runs in a row
      # ended after nine minutes of a sixty minute window with is_error false,
      # published nothing, and wrote not one line to LOG.md; from the repository
      # they looked identical to runs that never fired, and finding that out cost
      # an hour of reading `gh run view --log` by hand. The prompt has told every
      # run since 2026-08-13 to log even when it ships nothing, and a run that
      # gives up is precisely the run that skips that instruction: a rule that
      # fails on two different days becomes a check, which is the project's
      # standing ratchet.
      #
      # So the workflow measures the run rather than trusting it. Always a record
      # A new city should get its name in other languages without anyone
      # remembering to ask for it (Hidde, 2026-08-18: "bouw het zo dat als we in
      # de toekomst steden of namen toevoegen dit standaard practice is"). The
      # generator only queries cities it has never seen, so on a night that
      # published nothing this makes zero network calls and commits nothing.
      - name: Names in other languages for any new city
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/city_names.py || echo "lookup failed, next run picks it up"
          git add data/city-aliases.json
          git diff --cached --quiet && { echo "no new cities to name"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git commit -q -m "Search names for the cities opened this run"
          git pull --rebase -q
          git push -q || echo "names recorded locally, push refused"

      # in data/run-health.json (minutes, turns, commands the allowlist refused,
      # trees that reached data/cities, claims left behind); a LOG.md stub only
      # when the run wrote none of its own. It cannot fail the job: the work is
      # already done and pushed by the time this runs.
      - name: Run health
        if: always()
        continue-on-error: true
        env:
          RUN_START_SHA: ${{ steps.start.outputs.sha }}
          RUN_STARTED_AT: ${{ steps.start.outputs.at }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # The action reports the path; fall back to where it has always
          # written it, so a rename upstream costs the numbers and not the step.
          if [ -z "$CLAUDE_EXECUTION_FILE" ] || [ ! -f "$CLAUDE_EXECUTION_FILE" ]; then
            CLAUDE_EXECUTION_FILE="${RUNNER_TEMP:-/home/runner/work/_temp}/claude-execution-output.json"
          fi
          python3 scripts/run_health.py \
            --execution-file "$CLAUDE_EXECUTION_FILE" \
            --since-sha "$RUN_START_SHA" \
            --started "$RUN_STARTED_AT"
          # in-flight.json too: run_health.py releases the claims this run
          # still held, and a release nobody pushes is not a release. That is
          # the same failure the claim system was built around, since a claim
          # is only visible to other runs once it reaches the remote.
          git add data/run-health.json LOG.md data/in-flight.json
          git diff --cached --quiet && { echo "nothing to record"; exit 0; }
          # The action revokes its own app token on the way out, so the remote
          # url it configured is dead by now. Push as the workflow itself.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git commit -q -m "Run health: what the $(date -u +%H:%M) run did with its window"
          git pull --rebase -q
          git push -q || echo "run health recorded locally, push refused"

      - name: Chain status
        if: always()
        run: echo "Self-chaining off since 2026-07-31 (usage limit). Cron only; nothing to dispatch."
