name: City research

on:
  schedule:
    # Every hour, around the clock. These runs share Hidde's Claude Pro
    # subscription, which has a rolling 5-hour usage window, so most attempts
    # hit the limit and stop after one turn. That is the design: a failed
    # attempt costs almost nothing, so knocking hourly lets the work through
    # whenever the window has room, and covers for GitHub's habit of delaying
    # or skipping scheduled triggers. Concurrency below stops overlap.
    #
    # Every hour, around the clock: Hidde is away, so nothing else is drawing on
    # the allowance and the runs may take all of it. Restore the protected
    # working block when he is back by replacing this with:
    #   - cron: "0 19-23 * * *"
    #   - cron: "0 0-7 * * *"
    # which leaves 10:00-21:00 Amsterdam free.
    # Every 20 minutes. Measured 2026-07-21: GitHub has fired exactly three
    # scheduled runs in this repo's entire history, across three different cron
    # settings, so the frequency here barely matters. An earlier note here
    # blamed the */20 setting for that, which the data does not support: hourly
    # produced no firings either. Left frequent because a rejected attempt costs
    # nothing on a public repo and might catch an open usage window.
    #
    # The real mitigation is not this line, it is the long job timeout below:
    # when a trigger does land, the run stays alive for hours and waits out the
    # usage limit rather than exiting and hoping GitHub fires again.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: nightly-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # GitHub allows six hours per job. We used 90 minutes, which made sense when
    # runs fired hourly, and stopped making sense once it turned out GitHub only
    # honours a handful of schedules a day. If a trigger is rare, it should be
    # worth as much as possible: work, and when the usage window closes, wait for
    # it to reopen inside the same run rather than hoping GitHub fires again.
    timeout-minutes: 345
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run the research workflow from CLAUDE.md
        uses: anthropics/claude-code-action@v1
        env:
          # The runs' eyes: lets a run read the visitor trend itself via
          # scripts/visitors.py and carry it into LOG.md. Absent secret = the
          # script prints one line and the run continues blind, never broken.
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running the autonomous research workflow for the Ancient Trees
            project. Read CLAUDE.md in the repository root and execute "The research
            workflow (autonomous run)" exactly as written.

            Begin every run with: python3 scripts/visitors.py. Carry its 7-day
            visits line into your LOG.md entry, and let it steer depth choices
            (deepen what people actually visit). If it says no token or refuses,
            skip it silently and work on.

            Step 0 holds a priority ladder; work out which rung applies and do that.
            Reader submissions outrank everything. Something published being wrong
            outranks everything below it. Otherwise the job is depth, as follows.

            Depth is the current phase, opened 2026-07-26 on Search Console
            evidence: impressions double daily and city pages rank on page one, so
            Phase 1 of GO_TO_MARKET.md is live. New cities are frozen until the depth
            exit test in CLAUDE.md rung 6 passes (the eight search-served cities
            at 8+ photos and 2 or fewer vague pins, Amsterdam at zero); a run that
            finds the test passing reopens coverage itself: Netherlands wave first,
            per rung 6's order, counts per the doctrine (ten is a cap never a
            quota, four verified trees minimum for a page). The work is making the pages
            people land on deliver the promise: resolve approximate pins to exact
            coordinates via registers, open data and street-level sources, and hunt
            photos to the 80 percent floor. Order: Amsterdam to flawless first (the
            reference city), then Lisbon, Istanbul, Rome, then the rest of the lead
            group and marquee Europe, oldest-first. Hunt photos widely: Wikimedia,
            iNaturalist, Flickr under CC, Openverse, park authorities. Never publish
            a photo without a verified open licence and attribution; where a photo or
            an exact pin genuinely cannot be found, record it in CURATION.md and move
            on rather than looping. Never mark a pin confirmed without a source that
            places the tree itself: honesty about precision is the one thing depth
            work must never spend. The full ladder in CLAUDE.md governs, and hard
            rule 10 (public trees only, never a location its source hides) is
            absolute.

            Whatever the work turns out to be: verify against two independent
            sources, follow TONE_OF_VOICE.md and SEO_GEO_BLUEPRINT.md, set
            location_precision on every tree you touch, run
            python3 scripts/build_site.py to confirm the site still builds and every
            contract validates, then commit, append to LOG.md, and push.

            Respect every hard rule in CLAUDE.md, including the mandate: the two
            ranked goals, the three question test for anything nobody wrote a rule
            for, and the hard list of five things that stay closed.

            Getting through the usage limit at all is the rare event here, so do not
            stop after one item. When a piece of work is finished, committed and
            pushed, go back to Step 0, pick the next rung, and keep going until the
            usage limit stops you or the clock runs out.

            When every content rung is satisfied, the job continues: take the top
            item from PRODUCT_TODO.md and build it, under that file's rules
            (reversible only, contracts validate, done-when checked by build or
            grep, no visual-taste work, nothing from the hard list). The product
            is yours to improve, not only the data.

            Two rules on that, and they matter more than the throughput:
            - Finish and commit each item completely before starting the next. A
              half-researched city is worse than none. Never leave one part done.
            - Start no new item after 5 hours. The job is killed at 345 minutes,
              and work killed mid-flight is work lost.
            - If you hit the usage limit, do not exit. Wait and try again: the
              window is rolling, so it reopens while this job is still alive, and
              a scheduled trigger may not come again for hours.
          claude_args: |
            --allowedTools "Bash(git:*),Bash(python3:*),Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      # Continuous mode. GitHub fires the schedule only a handful of times a day
      # for this repo, so most open usage windows go unused. When a token is
      # present this step re-dispatches the workflow at the end of every run, so
      # the chain keeps itself alive independently of GitHub's flaky cron.
      #
      # Inert without the secret: no SELF_DISPATCH_TOKEN means this exits quietly
      # and the */20 cron remains the only trigger, so adding the step breaks
      # nothing. To turn continuous mode off later, delete the secret.
      #
      # The 10 minute throttle stops a closed usage window from becoming a tight
      # failure loop: a run that hits the limit dies in seconds, waits here, then
      # dispatches, so retries land about every 10 minutes rather than every few
      # seconds. Public repo, so the runner minutes this consumes are free.
      - name: Keep the chain alive (continuous mode)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SELF_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No SELF_DISPATCH_TOKEN set. Continuous mode off; relying on the cron."
            exit 0
          fi
          echo "Continuous mode on. Throttling before the next dispatch."
          sleep 600
          gh workflow run nightly.yml --repo "${{ github.repository }}" \
            && echo "Next run dispatched." \
            || echo "Dispatch failed; the cron will cover it."
