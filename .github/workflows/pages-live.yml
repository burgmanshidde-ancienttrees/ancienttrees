name: Live pages run

# Do the live pages RUN, every hour (Hidde, 2026-11-06). uptime.yml asks
# whether the site answers; this opens the same page set as the deploy's
# browser check (scripts/pagecheck.py) on ancienttrees.app in a real Chrome,
# at desktop and phone width, and goes red when a tab crashes, hangs, or
# throws an error from our own scripts. It catches what the deploy's check
# cannot: a fault that comes with the data or a service the pages call, after
# the build. scripts/quality.py reads these runs for the Web "Live" light and
# health.py makes a red one rung-2 work; rollback.yml puts back the last good
# build while the fix builds. Nothing is written to the repository.

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-live
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pagecheck.py
          sparse-checkout-cone-mode: false

      - name: Install the browser check
        run: python3 -m pip install --quiet playwright==1.60.0

      - name: Do the live pages run in Chrome
        run: python3 scripts/pagecheck.py --live
