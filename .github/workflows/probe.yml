name: Egress probe
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch bucketed thumbnails
        run: |
          set +e
          for u in \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Q98444729.jpg/960px-Q98444729.jpg" \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Q98444729.jpg/500px-Q98444729.jpg" \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/HRAST_CVETNI_TRG_1.JPG/960px-HRAST_CVETNI_TRG_1.JPG" ; do
            code=$(curl -sS -m 25 -o /tmp/out.bin -w '%{http_code}' -A 'AncientTreesBot/1.0 (https://ancienttrees.app)' "$u")
            printf '%-6s %9s bytes  %s\n' "$code" "$(wc -c </tmp/out.bin)" "$u"
            file /tmp/out.bin
          done
