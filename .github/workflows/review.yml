name: Fresh-eyes review

# The reviewer layer of the QA form (CLAUDE.md, QA section; approved by Hidde
# 2026-07-29). A separate, empty context reviews the last day's work against
# the recorded corpus, because the builder cannot see its own blind spots:
# the dead check-in button shipped through a builder who verified his own
# work thoroughly. One run per day, findings only, never fixes.

on:
  schedule:
    # 06:10 UTC, before Hidde's morning. It is also TEN MINUTES AFTER a night
    # run starts, and each of those has a two hour window, which is why this
    # job died instantly on 24, 25 and 26 August: 377ms, one turn, zero cost
    # and no model usage at all, the signature of an allowance that is already
    # spent rather than of broken code. Nothing noticed, because running it by
    # hand later in the day worked and left a green run behind.
    - cron: "10 6 * * *"
    # A second attempt, which does nothing at all when the morning one
    # succeeded, so on an ordinary day it costs a few seconds. Hidde still
    # gets the review with his coffee when there is room for it, and gets it
    # in the afternoon instead of never when there is not.
    #
    # This used to say it sat "in the only window the night chain leaves
    # alone (it fires every two hours from 18:00 to 10:00 UTC)". That stopped
    # being true on 2026-08-28, when the knocks went to twelve a day round the
    # clock, and the sentence outlived the fact for four weeks. There is no
    # quiet window now, so both crons were competing with the night shift for
    # one allowance: eight of nine scheduled attempts between 19 and 23
    # September died in one turn for zero dollars, and four days carry no
    # review entry at all. What actually fixes it is knock.yml standing the
    # night shift down on a day with no review yet, because only the thing
    # SPENDING the allowance can give it back. These crons stay as the floor
    # for the case where the watchdog itself is starved.
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  # To download the app's screenshots from the newest green ios.yml run
  # (2026-08-25). Reviewing the app means looking at pictures, and the pictures
  # already exist: rebuilding the app here would need a macOS runner and half an
  # hour before the review could start.
  actions: read

concurrency:
  group: fresh-eyes-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Has today already been reviewed? The second cron exists only to catch
      # a morning that died on the usage allowance, so when the morning worked
      # this ends the job in a few seconds rather than reviewing the same day
      # twice and writing a second entry nobody asked for.
      - name: Was today already reviewed
        id: already
        run: |
          TODAY=$(date -u +%F)
          if grep -qE "^## $TODAY" REVIEW.md 2>/dev/null; then
            echo "REVIEW.md already carries an entry for $TODAY"
            echo "done=yes" >> "$GITHUB_OUTPUT"
          else
            echo "done=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.already.outputs.done != 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        if: steps.already.outputs.done != 'yes'
        working-directory: site
        run: npm ci

      - name: Build site
        if: steps.already.outputs.done != 'yes'
        working-directory: site
        run: npx astro build

      # The app's half, and it is deliberately the cheap half.
      #
      # Hidde, 2026-08-25: "die fresh eye review kunnen we een voor app en web
      # doen in de nacht?" Yes, and in ONE reviewer rather than two, because the
      # corpus it reviews against is one corpus and a finding about a promise the
      # app makes is the same kind of finding as one about the website.
      #
      # It reads the artifact the app's own gate produced rather than building
      # the app: same pictures the layout gate judged, no macOS runner, no
      # simulator, and a few hours old at worst. When there is no green ios.yml
      # run to take them from, the step says so and the review does its web half
      # alone; an app review that blocks the web review would be worse than none.
      - name: Fetch the app's screenshots
        if: steps.already.outputs.done != 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(gh run list --workflow=ios.yml --status=success -L 1 \
                 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -z "$ID" ]; then
            echo "no green iOS run to take screenshots from" > /tmp/appshots-note.txt
            exit 0
          fi
          mkdir -p /tmp/appshots
          gh run download "$ID" --pattern 'appsweep-*' --dir /tmp/appshots \
            || echo "the newest green run kept no screenshots" > /tmp/appshots-note.txt
          python3 scripts/pick_app_screens.py --dir /tmp/appshots --count 6 \
            > /tmp/appshots-list.txt 2>/tmp/appshots-note.txt || true
          echo "reviewing these app screens:"; cat /tmp/appshots-list.txt || true

      - name: Review the last day with fresh eyes
        if: steps.already.outputs.done != 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the FRESH-EYES REVIEWER for Ancient Trees, deliberately
            without the builder's context. You review; you never fix. A
            reviewer who starts fixing becomes a builder grading their own
            homework, which is the failure this job exists to prevent.

            Do exactly this:

            1. Read CLAUDE.md, PRODUCT_IA.md, PRINCIPLES.md, DECISIONS.md,
               SEO_GEO_BLUEPRINT.md and TONE_OF_VOICE.md. That corpus is the
               standard; your taste is not.
            2. Look at what changed in the last 24 hours:
               `git log --since="24 hours ago" --stat` and the diffs of the
               most substantial commits (`git show <sha>`). Skim REVIEW.md so
               you do not repeat yesterday's findings.
            3. Inspect the BUILT product in site/dist (it is already built):
               open the changed pages' HTML plus a random sample of 5 others.
               Read them as a visitor would: does the page contradict itself,
               promise something that is not there, leak code as text, claim
               precision the data does not have, break a hard rule (em
               dashes, banned words, superlative collisions, missing photo
               licences, private locations)?
            4. THE APP, the same eyes on the other surface. Read
               /tmp/appshots-list.txt: it names six screenshots of the app,
               rotated by date so every screen is seen inside four nights. Open
               each one with Read and LOOK at it. If the file is missing or
               empty, read /tmp/appshots-note.txt, say in one line that the app
               half could not run and why, and carry on with the web half.

               Judge them as the corpus judges a page, not as taste: does a
               screen contradict itself, promise something that is not there,
               show a control with no obvious purpose, leave a title that
               disagrees with the tab it sits under, crop a photograph through
               a rounded corner, or state a count the data does not have? The
               mechanical faults are already gated (appfit measures CLIPPED,
               SMALL and DRIFT on every push), so do NOT report a four point
               misalignment; report what a person would notice.

               Tag every app finding `APP` after its severity, because a night
               run may not fix visual work on the app (CLAUDE.md: runs do no
               visual-taste work) and needs to know at a glance that this one is
               for a session.
            4b. COMMIT THE WEB HALF BEFORE YOU LOOK AT THE APP. Do steps 5
               and 7 for what you have found so far, then come back and add
               the app findings to the same dated entry in a second commit.
               One run on 2026-09-23 reported success after 184 turns against
               a cap of 160, and everything it had found went nowhere because
               nothing had been written down yet. This is the rule CLAUDE.md
               already gives a research pass, in the one place it had never
               been applied: write findings as you find them, so a run that
               dies late leaves half a review rather than none.
            5. Write your findings to the TOP of REVIEW.md, under a heading
               `## YYYY-MM-DD` (today, UTC). Each finding: one line of
               severity BLOCKER / WARN / NOTE, what and where (file or URL),
               and why it violates the corpus (name the rule). If you found
               nothing, write the dated heading with the single line
               "Nothing found." Honesty over volume: three real findings
               beat fifteen nitpicks, and style preferences are not findings.
            6. On Mondays (UTC), one extra duty (Hidde, 2026-07-29): audit
               the corpus documents themselves (CLAUDE.md, PRINCIPLES.md,
               PRODUCT_IA.md, BACKLOG.md, GO_TO_MARKET.md, DECISIONS.md) for
               rot: stale snapshots, sentences superseded by later decisions,
               internal contradictions, pure history that belongs in
               DECISIONS.md, and instructions no run can still execute. Write
               each as a NOTE with a concrete removal or move suggestion.
               Suggest only; corpus edits are decided in session.
            6b. On Mondays (UTC), a second extra duty, and it is a READING
               rather than a checking (Hidde, 2026-09-24: "hoe zorgen we dat je
               nooit meer spelfouten maakt als je copy live zet... het gaat non
               stop fout", and on the cadence, "elke nacht is mss wat veel 1
               keer per week copy check ok"). scripts/spellcheck.py catches a
               MISSPELLED word in the pre-push hook and can catch nothing else:
               the mistake that prompted this was "ask a question if we need
               one", five correctly spelled words in the wrong idiom, and no
               script here will ever see that.
               So: read the ENGLISH a reader meets, changed in the last seven
               days. `git log --since=7.days -p -- site/src/lib/i18n.ts
               site/src/lib/signin-strings.ts 'site/src/pages/**' \
               'site/src/components/**' 'ios/AncientTrees/AncientTrees/Screens/**'`
               and judge only the added strings, as a native reader who owes us
               nothing: is it grammatical, is it idiomatic, does it say what it
               means. Write each as a WARN with the file, the sentence and a
               replacement, and nothing about taste. PRODUCT_COPY.md governs
               the register and copycheck.py already greps for its five habits,
               so do not repeat those; this duty is about the English itself.
               If it all reads well, say so in one line.
            7. Commit ONLY REVIEW.md with the message
               "Fresh-eyes review: <n> finding(s)" and push. Twice, per 4b:
               once for the web half and once when the app findings join it.
               Touch no other file, fix nothing, however tempting. This repo
               takes commits all day, so if a push is rejected because main
               moved, `git pull --rebase` and push again; your entry goes at
               the top of a file nobody else edits, so it rebases cleanly.

            Research runs pick BLOCKERs up as rung-2 work (the site is
            broken) and WARNs as rung-3. You flag FOR HIDDE inside your
            REVIEW.md entry only for judgment calls no run may make alone
            (pricing, brand, blueprint changes, anything on the hard list).
          # 220 turns since 2026-09-24, raised from the 160 set on 2026-08-25
          # for the six screenshots. The site has grown a third of its pages
          # since, and a real review of a busy day now runs past the old cap:
          # 2026-09-23 finished its work in 184 and the action failed it for
          # overshooting. The commit-the-web-half-first rule above is the part
          # that matters, because a cap is a cap and one day will be busier
          # than this one.
          claude_args: "--max-turns 220 --allowedTools \"Bash(git:*),Bash(python3:*),Bash(cat:*),Read,Write,Edit,Glob,Grep\""
