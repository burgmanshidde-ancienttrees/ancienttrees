name: Weekly analysis

# Monday-morning deep dive (Hidde, 2026-08-01): one analytical pass over the
# week's data that produces SUGGESTIONS, never builds. Lands in DATA.md so
# Hidde reads it with the same coffee as his Monday usage glance.

on:
  schedule:
    # MONDAY 11:30 UTC, moved off 05:30 on 2026-08-27.
    #
    # It sat two minutes before a night run and died the same way the
    # fresh-eyes review died on three consecutive mornings: one turn, zero
    # cost, no model usage at all and no error message anywhere in the log. The
    # weeks it SUCCEEDED are the tell: 10 and 17 August, when GitHub happened to
    # delay the schedule to 08:02 and 10:03. On 24 August it fired on time and
    # died. Nothing noticed for three days, because the brief's own check could
    # only see four hours back.
    #
    # 11:30 is inside the only window the night chain leaves alone (it fires
    # every two hours from 18:00 to 10:00 UTC). Later than his coffee, which
    # a weekly reading can afford and a broken one cannot.
    - cron: "30 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: weekly-analysis
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Hidde, 2026-08-08: "moeten we een ritme afspreken dat we dit opruimen".
      # Deterministic, so it runs as a script rather than costing an agent:
      # entries older than a week move to archive/, nothing is deleted, and the
      # living files stay small enough to read cheaply. Runs BEFORE the analyst
      # so it reads a tidy LOG.md, and commits separately so a failure here
      # cannot take the analysis down with it.
      - name: Archive log entries older than a week
        continue-on-error: true
        run: |
          python3 scripts/archive_logs.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A LOG.md CURATION.md archive/
            git commit -m "Archive log entries older than a week"
            git push
          fi

      - name: Weekly data analysis
        uses: anthropics/claude-code-action@v1
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the WEEKLY ANALYST for Ancient Trees (ancienttrees.app).
            You analyse and suggest; you never build or edit anything except
            the analysis entry itself.

            1. Read DATA.md (the last 7 daily entries), plus the strategy
               context in CLAUDE.md ("The value proposition", the current
               phase), GO_TO_MARKET.md and the newest LOG.md entries.
            2. Look at the week as a WEEK: click and impression totals versus
               the prior week, position trend, which pages gained or stalled,
               beacon referrers/countries/devices, waitlist and submission
               counts if LOG mentions them, and the utilization meter.
            2b. Maintain the SCORECARD: one compact markdown table row per
               week (impressions, clicks, CTR, visits, directions clicks,
               directions-per-visit, app-cta, waitlist total, submissions
               total). Funnel RATIOS over raw counts: rates hold meaning at
               volumes where counts are noise. Segment by device where the
               beacon allows. Search-term events (the detail column of the
               events table) are a standing content-gap source: a term
               searched but unserved is a lead.
            3. Write "## Weekly analysis YYYY-MM-DD" at the TOP of DATA.md
               (above the daily entries) with: (a) five lines max on what
               actually moved; (b) three to five CONCRETE improvement
               suggestions ranked by expected impact, each one actionable and
               tagged [run] (a research run can do it), [sessie] (needs a
               working session), or [FOR HIDDE] (his decision); (c) one line
               on what to watch next week. Volume honesty applies: at noise
               level, say so rather than narrating trends. Suggestions must
               trace to a number in the data, never to taste.
            4. Commit ONLY DATA.md with message "Weekly analysis" and push.
          claude_args: "--max-turns 40 --allowedTools \"Bash(git:*),Bash(python3:*),Read,Write,Edit,Glob,Grep,WebSearch,WebFetch\""
