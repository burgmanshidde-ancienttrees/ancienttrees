<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autumn event mockup</title>
<style>
  body { margin: 0; background: #e9e9ee; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: #000; display: flex; gap: 28px; justify-content: center; padding: 24px 16px; flex-wrap: wrap; }
  .phone { width: 375px; background: #fff; border-radius: 44px; border: 10px solid #111; overflow: hidden; }
  .status { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; }
  .screen { padding: 8px 20px 24px; }
  .h1 { font-size: 30px; font-weight: 700; margin: 6px 0 14px; letter-spacing: -0.5px; }
  .search { background: #eeeef0; border-radius: 10px; height: 36px; display: flex; align-items: center; padding: 0 10px; color: #8a8a8e; font-size: 16px; margin-bottom: 18px; }
  .applist { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .icon { width: 60px; height: 60px; border-radius: 14px; border: 0.5px solid #ddd; }
  .icon.sm { width: 38px; height: 38px; border-radius: 9px; }
  .appname { font-size: 16px; font-weight: 500; }
  .appsub { font-size: 13px; color: #8a8a8e; }
  .get { margin-left: auto; background: #eeeef0; color: #007aff; font-weight: 700; font-size: 15px; border-radius: 16px; padding: 5px 20px; }
  .label { font-size: 12px; font-weight: 600; color: #8a8a8e; letter-spacing: 0.3px; text-transform: uppercase; margin: 2px 0 6px; }
  .card { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,0.6)); color: #fff; }
  .ename { font-size: 22px; font-weight: 700; line-height: 1.15; }
  .edesc { font-size: 14px; margin-top: 2px; }
  .below { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .caption { text-align: center; font-size: 15px; font-weight: 600; color: #333; margin-top: 10px; }
</style>
</head>
<body>
<script>
  const options = [["ginkgo", "A: golden ginkgo"], ["hill", "B: lone tree on a hill"], ["oak", "C: old oak"]];
  for (const [key, label] of options) {
    document.write(`
<div>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●● ▮</span></div>
    <div class="screen">
      <div class="h1">Search</div>
      <div class="search">old tree map</div>
      <div class="applist">
        <img class="icon" src="icon.png" alt="">
        <div>
          <div class="appname">Ancient Trees: Old Tree Map</div>
          <div class="appsub">Remarkable trees near you</div>
        </div>
        <div class="get">Get</div>
      </div>
      <div class="label">New season</div>
      <div class="card">
        <img src="autumn-${key}-1920x1080.jpg" alt="">
        <div class="shade">
          <div class="ename">Autumn is here</div>
          <div class="edesc">Find the ancient trees around you</div>
        </div>
      </div>
      <div class="below">
        <img class="icon sm" src="icon.png" alt="">
        <div class="appname" style="font-size:14px">Ancient Trees</div>
        <div class="get">Get</div>
      </div>
    </div>
  </div>
  <div class="caption">${label}</div>
</div>`);
  }
</script>
</body>
</html>
